<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Notes Repository</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        background: #fdf8c8;
        color: #252525;
      }

      main {
        max-width: 760px;
        margin: 4rem auto;
        padding: 2rem;
        background: #fff8a9;
        border: 2px solid #f0dc54;
        border-radius: 14px;
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin-top: 0;
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.65rem 1rem;
        border-radius: 8px;
        background: #ffcf31;
        color: #1d1d1d;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        background: #f3be08;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sticky Notes Repository</h1>
      <p>
        Welcome! This website is the home for the Sticky Notes repository.
      </p>
      <p>
        Explore updates, ideas, and project files directly from GitHub.
      </p>
      <a href="https://github.com/daxshonly/sticky-notes-website" target="_blank" rel="noreferrer">
        Open Repository
      </a>
    </main>
  </body>
</html>
